name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # the backend and the accounts-service example, each its own module
      - run: make build
      - name: Windows build and vet, tests included
        run: |
          GOOS=windows go vet ./...
          (cd docs/examples/accounts-service && GOOS=windows go vet ./...)
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          (cd docs/examples/accounts-service && go mod tidy -diff)

  test:
    name: test (Postgres + coverage)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # the same run as locally: a throwaway Postgres 18 in Docker, the schema's tests and
      # journal's two suites over it, and the backend's coverage by every test that reaches it
      - run: make test
